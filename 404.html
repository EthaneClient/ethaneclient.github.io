<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

  location.replace('https://ethane.site' + location.pathname + location.search + location.hash);
</script>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }

    display: grid; place-items: center;

    font: 15px/1.6 "JetBrains Mono", ui-monospace, Consolas, monospace;
    text-align: center; padding: 0 16px;
  }
  h1 {
    margin: 0 0 .4em; font-size: clamp(28px, 7vw, 56px); letter-spacing: .04em;
    background: linear-gradient(180deg, #8be1ff, #2fb4ff 60%, #0b5bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 0; color: #7d8db0; }
  a { color: #2fb4ff; text-decoration: none; border-bottom: 1px solid #0b5bff; }

  <main>
